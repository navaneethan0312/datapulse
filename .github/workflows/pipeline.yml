name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build-and-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  sonar-analysis:
    runs-on: self-hosted
    needs: build-and-test

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run SonarQube Scan
        run: |
          docker run --rm \
          -e SONAR_HOST_URL=${{ secrets.SONAR_HOST_URL }} \
          -e SONAR_TOKEN=${{ secrets.SONAR_TOKEN }} \
          -v ${{ github.workspace }}:/usr/src \
          sonarsource/sonar-scanner-cli \
          -Dsonar.projectKey=datapulse \
          -Dsonar.sources=. \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  deploy-staging:
    runs-on: self-hosted
    needs: sonar-analysis

    steps:

      - name: Deploy To Staging
        run: |
            bash /opt/datapulse/scripts/deploy-staging.sh
          

  production-approval:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production

    steps:
      - name: Approval Stage
        run: echo "Approved"

  deploy-production:
    runs-on: self-hosted
    needs: production-approval

    steps:

      - name: Deploy To Production
        run: |
            bash /opt/datapulse/scripts/deploy-production.sh
          
